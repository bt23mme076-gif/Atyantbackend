version: '3.8'

services:
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    ports:
      - "7880:7880"        # HTTP API
      - "7881:7881"        # TCP RTC
      - "50000-60000:50000-60000/udp"  # UDP RTC (reduce range if needed)
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    command: --config /etc/livekit.yaml

  egress:
    image: livekit/egress:latest
    restart: unless-stopped
    environment:
      - EGRESS_CONFIG_FILE=/etc/egress.yaml
    volumes:
      - ./egress.yaml:/etc/egress.yaml
      - /tmp/recordings:/tmp/recordings   # shared with host for Express to read
    cap_add:
      - SYS_ADMIN                         # required by egress for audio pipeline
