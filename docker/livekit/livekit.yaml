port: 7880
bind_addresses:
  - ""

rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: true

keys:
  # Replace with your actual key/secret — must match LIVEKIT_API_KEY / LIVEKIT_API_SECRET in .env
  YOUR_LIVEKIT_API_KEY: YOUR_LIVEKIT_API_SECRET

webhook:
  api_key: YOUR_LIVEKIT_API_KEY
  urls:
    - https://api.product.atyant.in/api/livekit/webhook

room:
  empty_timeout: 300    # 5 min
  max_participants: 2

logging:
  level: warn
